# ---- Site -------------------------------------------------------------
title: Fieldnotes
tagline: Architecture decisions, engineering details.
description: Practical insights on software architecture and engineering from system design and architectural patterns to implementation, testing, and the trade-offs that shape real-world systems.
lang: en
author:
  name: NR
  bio: Solution architect, pi-shaped — deep in software architecture and software engineering.

# For GitHub Pages project sites set baseurl to "/repo-name".
# For user sites (username.github.io) leave baseurl empty.
url: "https://niranjanrath.github.io"
baseurl: "/fieldnotes"   # must match the repository name exactly

# ---- Social (shown in footer + used by jekyll-seo-tag) ----------------
github_username: "niranjanrath"
twitter_username: ""
# seo-tag settings
logo: /assets/favicon.svg
social:
  name: NR

# Accent colour: teal (default) or terracotta
accent: terracotta

# ---- Build ------------------------------------------------------------
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  typographic_symbols: { hellip: "…", mdash: "—", ndash: "–" }

permalink: /:year/:title/
paginate: 6
paginate_path: /page:num/
timezone: Europe/Amsterdam

# Only plugins supported by GitHub Pages
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

feed:
  path: feed.xml

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: pages }
    values: { layout: default }

exclude: [docs, Gemfile, Gemfile.lock, README.md, node_modules, vendor, .github]

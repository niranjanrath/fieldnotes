<dialog class="search" id="search" aria-label="Search the blog">
  <form method="dialog" class="search-box" role="search">
    <div class="search-field">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <input id="search-input" type="search" placeholder="Search posts, topics, code…" autocomplete="off" spellcheck="false" aria-controls="search-results" aria-label="Search query">
      <button class="search-close" value="close" aria-label="Close search"><kbd>esc</kbd></button>
    </div>
    <ul id="search-results" class="search-results" role="listbox" aria-label="Results"></ul>
    <p class="search-hint" id="search-hint"><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></p>
  </form>
</dialog>

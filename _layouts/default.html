<!doctype html>
<html lang="{{ site.lang | default: 'en' }}" data-accent="{{ site.accent | default: 'terracotta' }}">
<head>
  {% include head.html %}
</head>
<body class="layout-{{ page.layout }}" data-search="{{ '/search.json' | relative_url }}" data-mermaid="{{ '/assets/js/vendor/mermaid.min.js' | relative_url }}">
  <a class="skip" href="#main">Skip to content</a>
  <div class="progress" aria-hidden="true"><span></span></div>

  {% include header.html %}

  <main id="main" tabindex="-1">
    {{ content }}
  </main>

  {% include footer.html %}
  {% include tabbar.html %}
  {% include search-dialog.html %}

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>

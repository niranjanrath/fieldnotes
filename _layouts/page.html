---
layout: default
---
<article class="page">
  <header class="post-head wrap-narrow">
    {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1 class="post-title">{{ page.title }}</h1>
    {%- if page.subtitle %}<p class="dek">{{ page.subtitle }}</p>{% endif %}
  </header>
  <div class="post-grid">
    <div class="prose" data-prose>
      {{ content }}
    </div>
  </div>
</article>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="C4 container diagram of a local-first app">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5a564a"/></marker></defs>
<rect width="1200" height="560" fill="#1b1a15"/>
<text x="40" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.6" fill="#ef8c5d">CONTAINER DIAGRAM · LOCAL-FIRST TODO APP</text>
<rect x="250" y="84" width="640" height="400" rx="20" fill="none" stroke="#3d3a30" stroke-width="1.5" stroke-dasharray="3 7"/>
<text x="270" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.2" fill="#958e7e">TRUST BOUNDARY · THE USER'S DEVICE</text>
<g><rect x="40" y="230" width="170" height="120" rx="14" fill="#23221c" stroke="#5a564a" stroke-width="1.6"/>
<text x="125.0" y="268" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" fill="#ece7da">Reader</text>
<text x="125.0" y="292" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#ef8c5d">Person</text>
<text x="125.0" y="320" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#958e7e">Uses the app daily</text></g>
<g><rect x="290" y="160" width="260" height="130" rx="14" fill="#2d2018" stroke="#ef8c5d" stroke-width="1.6"/>
<text x="420.0" y="198" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" fill="#ece7da">PWA shell</text>
<text x="420.0" y="222" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#ef8c5d">HTML · vanilla JS</text>
<text x="420.0" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#958e7e">UI, routing, offline cache</text></g>
<g><rect x="290" y="330" width="260" height="130" rx="14" fill="#23221c" stroke="#5a564a" stroke-width="1.6"/>
<text x="420.0" y="368" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" fill="#ece7da">Service worker</text>
<text x="420.0" y="392" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#ef8c5d">JS · Cache API</text>
<text x="420.0" y="420" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#958e7e">Precaches the app shell</text></g>
<g><rect x="600" y="245" width="250" height="130" rx="14" fill="#23221c" stroke="#5a564a" stroke-width="1.6"/>
<text x="725.0" y="283" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" fill="#ece7da">Local store</text>
<text x="725.0" y="307" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#ef8c5d">IndexedDB · Dexie</text>
<text x="725.0" y="335" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#958e7e">Primary copy of the data</text></g>
<g><rect x="930" y="245" width="230" height="130" rx="14" fill="#23221c" stroke="#5a564a" stroke-width="1.6" stroke-dasharray="7 6"/>
<text x="1045.0" y="283" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" fill="#ece7da">Sync API</text>
<text x="1045.0" y="307" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#ef8c5d">Optional · REST</text>
<text x="1045.0" y="335" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#958e7e">Share &amp; back up snapshots</text></g>

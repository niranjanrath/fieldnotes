<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="C4 container diagram of a local-first app">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9b927e"/></marker></defs>
<rect width="1200" height="560" fill="#faf7f1"/>
<text x="40" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.6" fill="#b4421a">CONTAINER DIAGRAM · LOCAL-FIRST TODO APP</text>
<rect x="250" y="84" width="640" height="400" rx="20" fill="none" stroke="#cdc3ad" stroke-width="1.5" stroke-dasharray="3 7"/>
<text x="270" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.2" fill="#6c6558">TRUST BOUNDARY · THE USER'S DEVICE</text>
<g><rect x="40" y="230" width="170" height="120" rx="14" fill="#ffffff" stroke="#9b927e" stroke-width="1.6"/>
<text x="125.0" y="268" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" fill="#1c1a16">Reader</text>
<text x="125.0" y="292" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#b4421a">Person</text>
<text x="125.0" y="320" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#6c6558">Uses the app daily</text></g>
<g><rect x="290" y="160" width="260" height="130" rx="14" fill="#f6e4d9" stroke="#b4421a" stroke-width="1.6"/>
<text x="420.0" y="198" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" fill="#1c1a16">PWA shell</text>
<text x="420.0" y="222" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#b4421a">HTML · vanilla JS</text>
<text x="420.0" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#6c6558">UI, routing, offline cache</text></g>
<g><rect x="290" y="330" width="260" height="130" rx="14" fill="#ffffff" stroke="#9b927e" stroke-width="1.6"/>
<text x="420.0" y="368" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" fill="#1c1a16">Service worker</text>
<text x="420.0" y="392" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#b4421a">JS · Cache API</text>
<text x="420.0" y="420" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#6c6558">Precaches the app shell</text></g>
<g><rect x="600" y="245" width="250" height="130" rx="14" fill="#ffffff" stroke="#9b927e" stroke-width="1.6"/>
<text x="725.0" y="283" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" fill="#1c1a16">Local store</text>
<text x="725.0" y="307" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#b4421a">IndexedDB · Dexie</text>
<text x="725.0" y="335" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#6c6558">Primary copy of the data</text></g>
<g><rect x="930" y="245" width="230" height="130" rx="14" fill="#ffffff" stroke="#9b927e" stroke-width="1.6" stroke-dasharray="7 6"/>
<text x="1045.0" y="283" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" fill="#1c1a16">Sync API</text>
<text x="1045.0" y="307" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#b4421a">Optional · REST</text>
<text x="1045.0" y="335" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#6c6558">Share &amp; back up snapshots</text></g>

<text x="240" y="252" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#6c6558">uses</text>
<line x1="552" y1="225" x2="598" y2="300" stroke="#9b927e" stroke-width="1.8" marker-end="url(#a)"/>
<text x="708" y="232" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#6c6558">reads / writes</text>
<line x1="420" y1="292" x2="420" y2="328" stroke="#9b927e" stroke-width="1.8" marker-end="url(#a)"/>
<text x="420.0" y="300.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#6c6558"></text>
<text x="470" y="316" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#6c6558">registers</text>
<line x1="852" y1="310" x2="928" y2="310" stroke="#9b927e" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#a)"/>
<text x="890.0" y="296" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#6c6558">export</text>
<text x="40" y="530" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#6c6558">Dashed = optional, added only when a real user asks for sync.</text>
